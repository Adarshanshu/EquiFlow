services:
  - type: web
    name: equiflow-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FRONTEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
